name: Java CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots -e verify
      - name: Check executable Spring Boot archive
        run: jar tf target/online-book-store-0.0.1-SNAPSHOT.jar | grep -q '^BOOT-INF/classes/'
      - name: Print Surefire Reports
        if: failure()
        run: |
          find target/surefire-reports -maxdepth 1 -type f \( -name "*.txt" -o -name "*.dump*" -o -name "*.xml" \) -print
          for file in target/surefire-reports/*.txt; do
            if [ -f "$file" ]; then
              echo "----- $file -----"
              cat "$file"
            fi
          done
      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore
