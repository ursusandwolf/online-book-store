databaseChangeLog:
  - changeSet:
      id: create-roles-table
      author: alex
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: roles
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    unique: true
                    nullable: false

  - changeSet:
      id: create-user-roles-table
      author: alex
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: user_roles
      changes:
        - createTable:
            tableName: users_roles
            columns:
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: role_id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: user_roles_user_fk
        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: user_roles_role_fk

  - changeSet:
      id: insert-roles
      author: alex
      preConditions:
        - onFail: MARK_RAN
          sqlCheck:
            expectedResult: 0
            sql: "SELECT COUNT(*) FROM roles WHERE name IN ('USER', 'ADMIN')"
      changes:
        - insert:
            tableName: roles
            columns:
              - column: { name: name, value: 'USER' }
              - column: { name: name, value: 'ADMIN' }

  - changeSet:
      id: insert-admin-user
      author: alex
      preConditions:
        - onFail: MARK_RAN
          sqlCheck:
            expectedResult: 0
            sql: "SELECT COUNT(*) FROM users WHERE email = 'admin@example.com'"
      changes:
        - insert:
            tableName: users
            columns:
              - column: { name: email, value: 'admin@example.com' }
              - column: { name: password, value: '$2a$10$2S7m0.WzO1rZ.8o9iN6UbeT5/YvVz6t9I6T/z6Kx6I1W8z6Kx6I1W' } # password: admin123
              - column: { name: first_name, value: 'Admin' }
              - column: { name: last_name, value: 'Admin' }

  - changeSet:
      id: assign-admin-role
      author: alex
      preConditions:
        - onFail: MARK_RAN
          sqlCheck:
            expectedResult: 0
            sql: "SELECT COUNT(*) FROM user_roles WHERE user_id = (SELECT id FROM users WHERE email = 'admin@example.com') AND role_id = (SELECT id FROM roles WHERE name = 'ADMIN')"
      changes:
        - insert:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  valueComputed: "(SELECT id FROM users WHERE email = 'admin@example.com')"
              - column:
                  name: role_id
                  valueComputed: "(SELECT id FROM roles WHERE name = 'ADMIN')"
